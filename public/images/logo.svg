<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <!-- Circular text path for seal -->
    <path id="textCircle" d="M 45,45 m -32,0 a 32,32 0 1,1 64,0 a 32,32 0 1,1 -64,0" />
    <linearGradient id="goldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="policeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Left Circular Seal / Badge -->
  <g transform="translate(4, 3)">
    <!-- Outer gold ring -->
    <circle cx="42" cy="42" r="40" fill="#0C1525" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="42" cy="42" r="38" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="2,2" />
    <circle cx="42" cy="42" r="28" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />

    <!-- Text around seal: WWW.JURNALPOLISI.CO.ID -->
    <path id="topArc" d="M 16,42 A 26,26 0 0,1 68,42" fill="none" />
    <text font-family="'Arial', sans-serif" font-size="5" font-weight="900" fill="#FCD34D" letter-spacing="1">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">
        WWW.JURNALPOLISI.CO.ID
      </textPath>
    </text>

    <!-- Bottom subtext: MEMBEDAH ASPIRASI -->
    <path id="bottomArc" d="M 68,44 A 26,26 0 0,1 16,44" fill="none" />
    <text font-family="'Arial', sans-serif" font-size="4.2" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
        DEMI KEADILAN &amp; KEBENARAN
      </textPath>
    </text>

    <!-- Central Shield & Star -->
    <g transform="translate(24, 23)">
      <!-- Police Shield -->
      <path d="M 18,3 C 27,3 34,8 34,8 C 34,22 26,32 18,35 C 10,32 2,22 2,8 C 2,8 9,3 18,3 Z"
            fill="url(#goldShield)" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M 18,6 C 24,6 30,10 30,10 C 30,20 24,28 18,31 C 12,28 6,20 6,10 C 6,10 12,6 18,6 Z"
            fill="#7F0000" />
      <!-- Star -->
      <polygon points="18,10 20.5,15.5 26.5,15.5 21.5,19.5 23.5,25.5 18,22 12.5,25.5 14.5,19.5 9.5,15.5 15.5,15.5"
               fill="#FCD34D" stroke="#B45309" stroke-width="0.5" />
      <!-- Small ribbon in shield -->
      <rect x="10" y="24" width="16" height="4" rx="1" fill="#DC2626" />
      <text x="18" y="27" font-family="'Arial', sans-serif" font-size="3" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        PRESISI
      </text>
    </g>
  </g>

  <!-- Typography Group (Black Serif & Blue Accent) -->
  <g transform="translate(95, 8)">
    <!-- Top Row: JURNAL + MEDIA MITRA POLRI & TNI -->
    <text x="0" y="26" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="900" fill="#000000" letter-spacing="1">
      JURNAL
    </text>

    <!-- Blue Label Pill: MEDIA MITRA POLRI & TNI -->
    <g transform="translate(132, 10)">
      <rect x="0" y="0" width="138" height="17" rx="3" fill="#0284C7" />
      <text x="69" y="12" font-family="'Arial', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        MEDIA MITRA POLRI &amp; TNI
      </text>
    </g>

    <!-- Middle Row: POLISI (Large Black Serif) -->
    <text x="0" y="60" font-family="'Georgia', 'Times New Roman', serif" font-size="42" font-weight="900" fill="#000000" letter-spacing="2">
      POLISI
    </text>

    <!-- Bottom Row: MEMBEDAH ASPIRASI, MEMBERI SOLUSI (Blue Bold Italic Sans) -->
    <text x="1" y="74" font-family="'Arial', 'Helvetica', sans-serif" font-size="11" font-weight="900" font-style="italic" fill="#0284C7" letter-spacing="0.8">
      MEMBEDAH ASPIRASI, MEMBERI SOLUSI
    </text>
  </g>
</svg>
