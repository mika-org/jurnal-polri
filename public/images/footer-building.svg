      <rect x="370" y="140" width="15" height="20" rx="2" />
      <rect x="395" y="140" width="15" height="20" rx="2" />
      <rect x="420" y="140" width="15" height="20" rx="2" />
      <rect x="370" y="175" width="15" height="20" rx="2" />
      <rect x="395" y="175" width="15" height="20" rx="2" />
