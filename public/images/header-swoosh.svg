<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 110" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="25%" stop-color="#F57C00" />
      <stop offset="50%" stop-color="#FB8C00" />
      <stop offset="75%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>

    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="30%" stop-color="#FFB74D" />
      <stop offset="70%" stop-color="#FEC57E" />
      <stop offset="100%" stop-color="#FFD180" />
    </linearGradient>
  </defs>

  <!-- Base Maroon Background -->
  <rect width="1600" height="110" fill="#7C0106" />

  <!-- Layer 1: Vibrant Orange Wave spanning full width edge to edge -->
  <path d="M 0,42 C 240,14 500,16 800,38 C 1100,60 1360,50 1600,65 L 1600,110 L 0,110 Z" 
        fill="url(#orangeGrad)" />

  <!-- Layer 2: Warm Peach Accent Ribbon spanning full width edge to edge -->
  <path d="M 0,58 C 250,30 510,32 810,54 C 1110,76 1370,66 1600,80 L 1600,110 L 0,110 Z" 
        fill="url(#peachGrad)" />

  <!-- Layer 3: Clean White Wave spanning full width edge to edge -->
  <path d="M 0,74 C 260,46 520,48 820,70 C 1120,90 1380,82 1600,94 L 1600,110 L 0,110 Z" 
        fill="#FFFFFF" />
</svg>
