<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 110" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="30%" stop-color="#F57C00" />
      <stop offset="65%" stop-color="#FB8C00" />
      <stop offset="90%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#CE5403" />
    </linearGradient>

    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="40%" stop-color="#FFB74D" />
      <stop offset="80%" stop-color="#FEC57E" />
      <stop offset="100%" stop-color="#FFD180" />
    </linearGradient>
  </defs>

  <!-- Base Maroon Background -->
  <rect width="1600" height="110" fill="#7C0106" />

  <!-- Layer 1: Vibrant Orange Wave -->
  <path d="M 0,68 C 120,38 280,18 450,20 C 660,22 860,52 1060,110 L 0,110 Z" 
        fill="url(#orangeGrad)" />

  <!-- Layer 2: Warm Peach Accent Ribbon -->
  <path d="M 0,86 C 130,54 290,36 460,38 C 660,40 840,70 1010,110 L 0,110 Z" 
        fill="url(#peachGrad)" />

  <!-- Layer 3: Clean White Wave -->
  <path d="M 0,105 C 40,96 110,76 220,70 C 370,62 540,64 710,72 C 810,78 880,94 940,110 L 0,110 Z" 
        fill="#FFFFFF" />
</svg>
